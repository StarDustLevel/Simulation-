<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gamify your life - track daily quests, build character stats, log your journey">
    <meta name="theme-color" content="#0f1b3c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Life Simulator">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230f1b3c' width='192' height='192'/><text x='96' y='120' font-size='100' fill='%23ffd700' text-anchor='middle' font-weight='bold' font-family='Arial'>⚡</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230f1b3c' width='192' height='192'/><text x='96' y='120' font-size='100' fill='%23ffd700' text-anchor='middle' font-weight='bold' font-family='Arial'>⚡</text></svg>">
    
    <title>Life Simulator - Daily Quest Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f1419 0%, #1a1f35 50%, #0f1419 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: #f0f8ff;
        }

        .simulator {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .day-nav {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }

        button {
            background: #1e3a52;
            color: #80e8ff;
            border: 1px solid #3a6a9f;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        button:hover {
            background: #2a4a6f;
            border-color: #80e8ff;
            color: #a0f0ff;
            box-shadow: 0 0 15px rgba(128, 232, 255, 0.25);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .delete-btn {
            background: rgba(255, 100, 150, 0.1);
            padding: 6px 10px;
            font-size: 12px;
            border: 1px solid #ff6496;
            color: #ff6496;
        }

        .delete-btn:hover {
            background: rgba(255, 100, 150, 0.2);
            box-shadow: 0 0 10px rgba(255, 100, 150, 0.3);
        }

        .date-display {
            font-size: 14px;
            color: #80e8ff;
            min-width: 120px;
            text-align: center;
            font-weight: 600;
        }

        .card {
            background: rgba(25, 45, 70, 0.8);
            border: 1px solid #3a7aaf;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        .card-title {
            font-size: 12px;
            font-weight: 700;
            color: #80e8ff;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quest-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quest-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(35, 60, 90, 0.5);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(128, 232, 255, 0.15);
        }

        .quest-item:hover {
            background: rgba(45, 80, 120, 0.6);
            border-color: rgba(128, 232, 255, 0.4);
        }

        .quest-item.completed {
            background: rgba(50, 100, 80, 0.4);
            border-color: rgba(100, 200, 150, 0.3);
        }

        .quest-item.trap {
            cursor: pointer;
        }

        .quest-item.trap:hover {
            background: rgba(110, 70, 90, 0.5);
            border-color: rgba(255, 100, 150, 0.3);
        }

        .quest-item.trap.triggered {
            background: rgba(130, 60, 90, 0.4);
            border-color: rgba(255, 100, 150, 0.3);
        }

        .quest-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #4a7aaf;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
            flex-shrink: 0;
            background: transparent;
        }

        .quest-item.completed .quest-checkbox {
            background: #5abf5a;
            border-color: #7ad07a;
            color: white;
            font-weight: bold;
        }

        .quest-item.trap.triggered .quest-checkbox {
            background: #d85a5a;
            border-color: #ff8a8a;
            color: white;
            font-weight: bold;
        }

        .quest-content {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .quest-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        .quest-name {
            font-size: 14px;
            font-weight: 500;
            flex: 1;
            color: #f0f8ff;
        }

        .quest-xp {
            font-size: 12px;
            color: #80e8ff;
            font-weight: 700;
            flex-shrink: 0;
        }

        .trap-xp {
            font-size: 12px;
            color: #ff8a8a;
            font-weight: 700;
            flex-shrink: 0;
        }

        .score-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .score-box {
            background: rgba(35, 65, 110, 0.5);
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #3a7aaf;
        }

        .score-label {
            font-size: 11px;
            color: #a0d0ff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .score-value {
            font-size: 28px;
            font-weight: 700;
            color: #80e8ff;
        }

        .stats-grid {
            display: grid;
            gap: 14px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #f0f8ff;
        }

        .stat-icon {
            font-size: 16px;
        }

        .stat-bars {
            display: flex;
            gap: 6px;
        }

        .bar {
            width: 24px;
            height: 16px;
            border-radius: 3px;
            background: rgba(50, 80, 120, 0.3);
            border: 1px solid #2a5a8f;
        }

        .bar.filled {
            background: linear-gradient(135deg, #5abf5a, #80e8ff);
            border-color: #80e8ff;
        }

        .journal-textarea {
            width: 100%;
            min-height: 140px;
            background: rgba(35, 60, 90, 0.4);
            border: 1px solid #3a7aaf;
            border-radius: 8px;
            padding: 12px;
            color: #f0f8ff;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            transition: all 0.3s;
            margin-bottom: 12px;
        }

        .journal-textarea:focus {
            outline: none;
            border-color: #80e8ff;
            background: rgba(35, 60, 90, 0.6);
            box-shadow: 0 0 12px rgba(128, 232, 255, 0.2);
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            min-width: 100px;
            background: rgba(35, 60, 90, 0.4);
            border: 1px solid #3a7aaf;
            border-radius: 8px;
            padding: 10px 12px;
            color: #f0f8ff;
            font-size: 14px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #80e8ff;
            background: rgba(35, 60, 90, 0.6);
            box-shadow: 0 0 12px rgba(128, 232, 255, 0.2);
        }

        .input-group input::placeholder {
            color: #7aacdf;
        }

        .input-group select {
            background: rgba(35, 60, 90, 0.4);
            border: 1px solid #3a7aaf;
            border-radius: 8px;
            padding: 10px 12px;
            color: #f0f8ff;
            font-size: 14px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .input-group select:focus {
            outline: none;
            border-color: #80e8ff;
            background: rgba(35, 60, 90, 0.6);
            box-shadow: 0 0 12px rgba(128, 232, 255, 0.2);
        }

        .input-group select option {
            background: #1a2a3f;
            color: #f0f8ff;
        }

        .add-btn {
            background: rgba(80, 200, 120, 0.3);
            border: 1px solid #80d0a0;
            padding: 10px 16px;
            color: #80e0b0;
            font-weight: 600;
        }

        .add-btn:hover {
            background: rgba(80, 200, 120, 0.4);
            border-color: #a0e0b0;
            box-shadow: 0 0 12px rgba(128, 224, 176, 0.25);
        }

        .day-stats {
            font-size: 12px;
            color: #a0d0ff;
            padding-top: 12px;
            border-top: 1px solid rgba(58, 122, 175, 0.3);
            font-weight: 500;
        }

        .section-header {
            font-size: 11px;
            color: #80e8ff;
            font-weight: 700;
            margin: 12px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .simulator {
                padding: 12px;
            }

            .card {
                padding: 16px;
            }

            .input-group {
                flex-direction: column;
            }

            .input-group input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="simulator">
        <div class="header">
            <div class="day-nav">
                <button onclick="prevDay()">← Prev</button>
                <div class="date-display" id="dateDisplay"></div>
                <button onclick="nextDay()">Next →</button>
            </div>
            <button onclick="goToToday()">Today</button>
        </div>

        <!-- Quests Card -->
        <div class="card">
            <div class="card-title">📊 Quests & Level</div>
            <div class="score-section">
                <div class="score-box">
                    <div class="score-label">Level</div>
                    <div class="score-value" id="playerLevel">1</div>
                </div>
                <div class="score-box">
                    <div class="score-label">Total XP</div>
                    <div class="score-value" id="totalXPDisplay">0</div>
                </div>
            </div>
            <div style="background: rgba(35, 60, 90, 0.4); padding: 12px; border-radius: 10px; margin-bottom: 16px; font-size: 12px; color: #a0d0ff; border: 1px solid #3a7aaf;">
                <div style="margin-bottom: 6px;">Next Level: <span id="xpToNext">500</span> XP away</div>
                <div style="background: rgba(20, 35, 55, 0.6); height: 8px; border-radius: 4px; overflow: hidden;">
                    <div id="xpBar" style="background: linear-gradient(90deg, #80e8ff, #80d080); height: 100%; width: 0%; transition: width 0.3s;"></div>
                </div>
            </div>
            <div class="quest-list" id="questList"></div>

            <!-- Add Custom Quest -->
            <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(58, 122, 175, 0.2);">
                <div class="section-header">+ Add Quest</div>
                <div class="input-group">
                    <input type="text" id="newQuestName" placeholder="Quest name">
                    <input type="number" id="newQuestXP" placeholder="XP" style="max-width: 80px;" min="1" value="20">
                    <select id="newQuestStat" style="flex: 1; min-width: 100px; background: rgba(35, 60, 90, 0.4); border: 1px solid #3a7aaf; border-radius: 8px; padding: 10px 12px; color: #f0f8ff; font-size: 14px;">
                        <option value="health">Health ❤️</option>
                        <option value="mind">Mind 🧠</option>
                        <option value="discipline">Discipline ⚔️</option>
                        <option value="confidence">Confidence 😎</option>
                    </select>
                    <button class="add-btn" onclick="addCustomQuest()">Add</button>
                </div>
            </div>
        </div>

        <!-- NPC Traps Card -->
        <div class="card">
            <div class="card-title">🪤 NPC Traps</div>
            <div class="quest-list" id="trapList"></div>

            <!-- Add NPC Trap -->
            <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(58, 122, 175, 0.2);">
                <div class="section-header">+ Add Trap</div>
                <div class="input-group">
                    <input type="text" id="newTrapName" placeholder="Trap name (e.g., Doom scrolling)">
                    <input type="number" id="newTrapXP" placeholder="XP Loss" style="max-width: 80px;" min="1" value="5">
                    <select id="newTrapStat" style="flex: 1; min-width: 100px; background: rgba(35, 60, 90, 0.4); border: 1px solid #3a7aaf; border-radius: 8px; padding: 10px 12px; color: #f0f8ff; font-size: 14px;">
                        <option value="health">Health ❤️</option>
                        <option value="mind">Mind 🧠</option>
                        <option value="discipline">Discipline ⚔️</option>
                        <option value="confidence">Confidence 😎</option>
                    </select>
                    <button class="add-btn" onclick="addNPCTrap()">Add</button>
                </div>
            </div>
        </div>

        <!-- Character Stats Card -->
        <div class="card">
            <div class="card-title">🎮 Character Stats</div>
            <div class="stats-grid" id="statsGrid"></div>
        </div>

        <!-- Journal Card -->
        <div class="card">
            <div class="card-title">📝 Daily Journal</div>
            <textarea
                class="journal-textarea"
                id="journal"
                placeholder="What glitch happened today? What lesson did the simulation teach me? What would Level 100 Me have done?"
            ></textarea>
            <div class="day-stats">
                💾 Auto-saved • Day <span id="dayIndicator"></span> • Total days tracked: <span id="daysTracked">0</span>
            </div>
        </div>

        <!-- Data Backup Card -->
        <div class="card">
            <div class="card-title">🛡️ Data Backup</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px;">
                <button onclick="exportData()" style="padding: 12px; background: #1a2a3f; border: 1px solid #80d0a0; color: #80d0a0;">📥 Export</button>
                <button onclick="importData()" style="padding: 12px; background: #1a2a3f; border: 1px solid #80e8ff; color: #80e8ff;">📤 Import</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_QUESTS = [];

        let QUESTS = [...DEFAULT_QUESTS];
        let currentDate = getLocalDate();
        let allDays = {};
        let stats = { health: 2, mind: 2, discipline: 2, confidence: 3 };
        let totalXP = 0;
        let customQuests = [];
        let npcTraps = [];

        function getLocalDate() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function dateStringToDate(dateStr) {
            const [year, month, day] = dateStr.split('-').map(Number);
            return new Date(year, month - 1, day);
        }

        function getLevelFromXP(xp) {
            return Math.max(1, Math.floor(xp / 500) + 1);
        }

        function getXPForLevel(level) {
            return (level - 1) * 500;
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW error:', err));
        }

        function loadData() {
            const saved = localStorage.getItem('lifeSimulator_days');
            if (saved) allDays = JSON.parse(saved);
            const savedStats = localStorage.getItem('lifeSimulator_stats');
            if (savedStats) stats = JSON.parse(savedStats);
            const savedXP = localStorage.getItem('lifeSimulator_totalXP');
            if (savedXP) totalXP = parseInt(savedXP, 10);
            const savedCustomQuests = localStorage.getItem('lifeSimulator_customQuests');
            if (savedCustomQuests) customQuests = JSON.parse(savedCustomQuests);
            const savedNPCTraps = localStorage.getItem('lifeSimulator_npcTraps');
            if (savedNPCTraps) npcTraps = JSON.parse(savedNPCTraps);
            QUESTS = [...DEFAULT_QUESTS, ...customQuests];
        }

        function saveData() {
            localStorage.setItem('lifeSimulator_days', JSON.stringify(allDays));
            localStorage.setItem('lifeSimulator_stats', JSON.stringify(stats));
            localStorage.setItem('lifeSimulator_totalXP', totalXP.toString());
            localStorage.setItem('lifeSimulator_customQuests', JSON.stringify(customQuests));
            localStorage.setItem('lifeSimulator_npcTraps', JSON.stringify(npcTraps));
        }

        function exportData() {
            const backup = { timestamp: new Date().toISOString(), allDays, stats, totalXP, customQuests, npcTraps };
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup-${getLocalDate()}.json`;
            a.click();
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = (e) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const backup = JSON.parse(event.target.result);
                        allDays = backup.allDays || {};
                        stats = backup.stats || { health: 2, mind: 2, discipline: 2, confidence: 3 };
                        totalXP = backup.totalXP || 0;
                        customQuests = backup.customQuests || [];
                        npcTraps = backup.npcTraps || [];
                        QUESTS = [...DEFAULT_QUESTS, ...customQuests];
                        saveData();
                        updateDisplay();
                        alert('Data restored!');
                    } catch (err) {
                        alert('Invalid file');
                    }
                };
                reader.readAsText(e.target.files[0]);
            };
            input.click();
        }

        function getCurrentDayData() {
            if (!allDays[currentDate]) allDays[currentDate] = { quests: {}, traps: {}, journal: '' };
            return allDays[currentDate];
        }

        function updateDisplay() {
            const date = dateStringToDate(currentDate);
            document.getElementById('dateDisplay').textContent = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            document.getElementById('dayIndicator').textContent = currentDate;
            document.getElementById('daysTracked').textContent = Object.keys(allDays).length;

            const dayData = getCurrentDayData();
            document.getElementById('journal').value = dayData.journal || '';

            const currentLevel = getLevelFromXP(totalXP);
            const levelXP = getXPForLevel(currentLevel);
            const nextLevelXP = getXPForLevel(currentLevel + 1);
            const xpInLevel = totalXP - levelXP;
            const xpNeeded = nextLevelXP - levelXP;
            const progress = (xpInLevel / xpNeeded) * 100;

            document.getElementById('playerLevel').textContent = currentLevel;
            document.getElementById('totalXPDisplay').textContent = totalXP;
            document.getElementById('xpToNext').textContent = Math.max(0, nextLevelXP - totalXP);
            document.getElementById('xpBar').style.width = Math.min(100, progress) + '%';

            updateQuests(dayData.quests);
            updateTraps(dayData.traps);
            updateStats();
        }

        function updateQuests(quests) {
            const list = document.getElementById('questList');
            list.innerHTML = '';
            QUESTS.forEach(quest => {
                const completed = quests[quest.id] || false;
                const isCustom = customQuests.some(q => q.id === quest.id);
                const statIcons = { health: '❤️', mind: '🧠', discipline: '⚔️', confidence: '😎' };
                const statIcon = statIcons[quest.stat] || '🎯';
                const div = document.createElement('div');
                div.className = `quest-item ${completed ? 'completed' : ''}`;
                div.innerHTML = `
                    <div class="quest-checkbox">${completed ? '✓' : ''}</div>
                    <div class="quest-content">
                        <span class="quest-icon">${quest.icon}</span>
                        <span class="quest-name">${quest.name}</span>
                        <span style="font-size: 12px; color: #a0d0ff;">${statIcon}</span>
                        <span class="quest-xp">+${quest.xp} XP</span>
                    </div>
                    ${isCustom ? `<button class="delete-btn" onclick="deleteCustomQuest('${quest.id}')">Delete</button>` : ''}
                `;
                div.onclick = (e) => { if (!e.target.classList.contains('delete-btn')) toggleQuest(quest.id); };
                list.appendChild(div);
            });
        }

        function updateTraps(traps) {
            const list = document.getElementById('trapList');
            list.innerHTML = '';
            npcTraps.forEach(trap => {
                const triggered = traps[trap.id] || false;
                const statIcons = { health: '❤️', mind: '🧠', discipline: '⚔️', confidence: '😎' };
                const statIcon = statIcons[trap.stat] || '🧠';
                const div = document.createElement('div');
                div.className = `quest-item trap ${triggered ? 'triggered' : ''}`;
                div.innerHTML = `
                    <div class="quest-checkbox">${triggered ? '✗' : ''}</div>
                    <div class="quest-content">
                        <span class="quest-icon">🪤</span>
                        <span class="quest-name">${trap.name}</span>
                        <span style="font-size: 12px; color: #a0d0ff;">${statIcon}</span>
                        <span class="trap-xp">${triggered ? '-' + trap.xp + ' XP' : ''}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteNPCTrap('${trap.id}')">Delete</button>
                `;
                div.onclick = (e) => { if (!e.target.classList.contains('delete-btn')) toggleTrap(trap.id); };
                list.appendChild(div);
            });
        }

        function updateStats() {
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = `
                ${createStatRow('Health', stats.health, '❤️')}
                ${createStatRow('Mind', stats.mind, '🧠')}
                ${createStatRow('Discipline', stats.discipline, '⚔️')}
                ${createStatRow('Confidence', stats.confidence, '😎')}
            `;
        }

        function createStatRow(label, value, icon) {
            const bars = Array(4).fill(0).map((_, i) => `<div class="bar ${i < value ? 'filled' : ''}"></div>`).join('');
            return `<div class="stat-row"><div class="stat-label"><span class="stat-icon">${icon}</span>${label}</div><div class="stat-bars">${bars}</div></div>`;
        }

        function toggleQuest(questId) {
            const dayData = getCurrentDayData();
            const wasCompleted = dayData.quests[questId];
            dayData.quests[questId] = !wasCompleted;

            const quest = QUESTS.find(q => q.id === questId);
            if (!wasCompleted) {
                if (quest) totalXP += quest.xp;
                
                // Increase stat based on quest's stat category
                if (quest.stat === 'health') stats.health = Math.min(4, stats.health + 1);
                if (quest.stat === 'mind') stats.mind = Math.min(4, stats.mind + 1);
                if (quest.stat === 'discipline') stats.discipline = Math.min(4, stats.discipline + 1);
                if (quest.stat === 'confidence') stats.confidence = Math.min(4, stats.confidence + 1);
            } else {
                if (quest) totalXP = Math.max(0, totalXP - quest.xp);
                
                // Decrease stat when unchecking
                if (quest.stat === 'health') stats.health = Math.max(0, stats.health - 1);
                if (quest.stat === 'mind') stats.mind = Math.max(0, stats.mind - 1);
                if (quest.stat === 'discipline') stats.discipline = Math.max(0, stats.discipline - 1);
                if (quest.stat === 'confidence') stats.confidence = Math.max(0, stats.confidence - 1);
            }

            saveData();
            updateDisplay();
        }

        function toggleTrap(trapId) {
            const dayData = getCurrentDayData();
            const wasTriggered = dayData.traps[trapId];
            dayData.traps[trapId] = !wasTriggered;

            const trap = npcTraps.find(t => t.id === trapId);
            if (!wasTriggered) {
                if (trap) {
                    totalXP = Math.max(0, totalXP - trap.xp);
                    // Decrease the stat associated with this trap
                    if (trap.stat === 'health') stats.health = Math.max(0, stats.health - 1);
                    if (trap.stat === 'mind') stats.mind = Math.max(0, stats.mind - 1);
                    if (trap.stat === 'discipline') stats.discipline = Math.max(0, stats.discipline - 1);
                    if (trap.stat === 'confidence') stats.confidence = Math.max(0, stats.confidence - 1);
                }
            } else {
                if (trap) {
                    totalXP += trap.xp;
                    // Restore the stat when unchecking
                    if (trap.stat === 'health') stats.health = Math.min(4, stats.health + 1);
                    if (trap.stat === 'mind') stats.mind = Math.min(4, stats.mind + 1);
                    if (trap.stat === 'discipline') stats.discipline = Math.min(4, stats.discipline + 1);
                    if (trap.stat === 'confidence') stats.confidence = Math.min(4, stats.confidence + 1);
                }
            }

            saveData();
            updateDisplay();
        }

        function addCustomQuest() {
            const name = document.getElementById('newQuestName').value.trim();
            const xp = parseInt(document.getElementById('newQuestXP').value) || 20;
            const statCategory = document.getElementById('newQuestStat').value || 'health';

            if (!name) return alert('Enter a quest name');

            const quest = { id: 'custom_' + Date.now(), name, icon: '🎯', xp, stat: statCategory };
            customQuests.push(quest);
            QUESTS.push(quest);

            document.getElementById('newQuestName').value = '';
            document.getElementById('newQuestXP').value = '20';
            document.getElementById('newQuestStat').value = 'health';

            saveData();
            updateDisplay();
        }

        function deleteCustomQuest(questId) {
            customQuests = customQuests.filter(q => q.id !== questId);
            QUESTS = QUESTS.filter(q => q.id !== questId);
            Object.values(allDays).forEach(day => delete day.quests[questId]);
            saveData();
            updateDisplay();
        }

        function addNPCTrap() {
            const name = document.getElementById('newTrapName').value.trim();
            const xp = parseInt(document.getElementById('newTrapXP').value) || 5;
            const statCategory = document.getElementById('newTrapStat').value || 'mind';

            if (!name) return alert('Enter a trap name');

            const trap = { id: 'trap_' + Date.now(), name, xp, stat: statCategory };
            npcTraps.push(trap);

            document.getElementById('newTrapName').value = '';
            document.getElementById('newTrapXP').value = '5';
            document.getElementById('newTrapStat').value = 'mind';

            saveData();
            updateDisplay();
        }

        function deleteNPCTrap(trapId) {
            npcTraps = npcTraps.filter(t => t.id !== trapId);
            Object.values(allDays).forEach(day => delete day.traps[trapId]);
            saveData();
            updateDisplay();
        }

        function prevDay() {
            const d = dateStringToDate(currentDate);
            d.setDate(d.getDate() - 1);
            currentDate = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            updateDisplay();
        }

        function nextDay() {
            const d = dateStringToDate(currentDate);
            d.setDate(d.getDate() + 1);
            currentDate = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            updateDisplay();
        }

        function goToToday() {
            currentDate = getLocalDate();
            updateDisplay();
        }

        document.getElementById('journal').addEventListener('input', () => {
            getCurrentDayData().journal = document.getElementById('journal').value;
            saveData();
        });

        loadData();
        updateDisplay();
    </script>
</body>
</html>
