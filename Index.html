<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gamify your life - track daily quests, build character stats, log your journey">
    <meta name="theme-color" content="#0f1b3c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Life Simulator">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230f1b3c' width='192' height='192'/><text x='96' y='120' font-size='100' fill='%23ffd700' text-anchor='middle' font-weight='bold' font-family='Arial'>⚡</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230f1b3c' width='192' height='192'/><text x='96' y='120' font-size='100' fill='%23ffd700' text-anchor='middle' font-weight='bold' font-family='Arial'>⚡</text></svg>">
    
    <title>Life Simulator - Daily Quest Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f1b3c 0%, #1a0e2e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: #fff;
        }

        .simulator {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .day-nav {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        button {
            background: #2a3f5f;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        button:hover {
            background: #3d5a7f;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .date-display {
            font-size: 14px;
            color: #a0a0a0;
            min-width: 120px;
            text-align: center;
        }

        .card {
            background: rgba(30, 40, 60, 0.6);
            border: 1px solid rgba(100, 150, 200, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: #a0c4ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quest-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quest-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(50, 70, 100, 0.4);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .quest-item:hover {
            background: rgba(60, 90, 130, 0.6);
            border-color: rgba(100, 150, 200, 0.3);
        }

        .quest-item.completed {
            background: rgba(70, 120, 80, 0.4);
            border-color: rgba(100, 200, 120, 0.3);
        }

        .quest-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #666;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
            flex-shrink: 0;
            background: transparent;
        }

        .quest-item.completed .quest-checkbox {
            background: #4CAF50;
            border-color: #66BB6A;
            color: white;
            font-weight: bold;
        }

        .quest-content {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .quest-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        .quest-name {
            font-size: 14px;
            font-weight: 500;
            flex: 1;
        }

        .quest-xp {
            font-size: 12px;
            color: #ffd700;
            font-weight: 600;
            flex-shrink: 0;
        }

        .score-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .score-box {
            background: rgba(50, 70, 100, 0.4);
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(100, 150, 200, 0.2);
        }

        .score-label {
            font-size: 11px;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .score-value {
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
        }

        .stats-grid {
            display: grid;
            gap: 14px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        .stat-icon {
            font-size: 16px;
        }

        .stat-bars {
            display: flex;
            gap: 6px;
        }

        .bar {
            width: 24px;
            height: 16px;
            border-radius: 4px;
            background: rgba(100, 100, 100, 0.3);
            border: 1px solid rgba(100, 100, 100, 0.5);
        }

        .bar.filled {
            background: linear-gradient(135deg, #4CAF50, #66BB6A);
            border-color: #66BB6A;
        }

        .journal-textarea {
            width: 100%;
            min-height: 140px;
            background: rgba(50, 70, 100, 0.4);
            border: 1px solid rgba(100, 150, 200, 0.2);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            transition: all 0.2s;
            margin-bottom: 12px;
        }

        .journal-textarea:focus {
            outline: none;
            border-color: rgba(100, 150, 200, 0.5);
            background: rgba(50, 70, 100, 0.6);
        }

        .day-stats {
            font-size: 12px;
            color: #a0a0a0;
            padding-top: 12px;
            border-top: 1px solid rgba(100, 150, 200, 0.1);
        }

        .install-prompt {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(76, 175, 80, 0.9);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            display: none;
            gap: 12px;
            align-items: center;
            z-index: 1000;
        }

        .install-prompt.show {
            display: flex;
        }

        .install-prompt button {
            background: #2a3f5f;
            padding: 8px 12px;
            font-size: 12px;
        }

        .install-prompt button:last-child {
            background: transparent;
            color: #fff;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .simulator {
                padding: 12px;
            }

            .card {
                padding: 16px;
            }

            .install-prompt {
                bottom: 16px;
                right: 16px;
                left: 16px;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="simulator">
        <div class="header">
            <div class="day-nav">
                <button onclick="prevDay()">← Prev</button>
                <div class="date-display" id="dateDisplay"></div>
                <button onclick="nextDay()">Next →</button>
            </div>
            <button onclick="goToToday()">Today</button>
        </div>

        <!-- Quests Card -->
        <div class="card">
            <div class="card-title">📊 Quests & Level</div>
            <div class="score-section">
                <div class="score-box">
                    <div class="score-label">Level</div>
                    <div class="score-value" id="playerLevel">1</div>
                </div>
                <div class="score-box">
                    <div class="score-label">Total XP</div>
                    <div class="score-value" id="totalXPDisplay">0</div>
                </div>
            </div>
            <div style="background: rgba(50, 70, 100, 0.4); padding: 12px; border-radius: 10px; margin-bottom: 16px; font-size: 12px; color: #a0a0a0;">
                <div style="margin-bottom: 6px;">Next Level: <span id="xpToNext">500</span> XP away</div>
                <div style="background: rgba(30, 40, 60, 0.6); height: 8px; border-radius: 4px; overflow: hidden;">
                    <div id="xpBar" style="background: linear-gradient(90deg, #4CAF50, #66BB6A); height: 100%; width: 0%; transition: width 0.3s;"></div>
                </div>
            </div>
            <div class="score-section">
                <div class="score-box">
                    <div class="score-label">Today's Quests</div>
                    <div class="score-value" id="questScore">0/7</div>
                </div>
                <div class="score-box">
                    <div class="score-label">Today's XP</div>
                    <div class="score-value" id="xpEarned">0</div>
                </div>
            </div>
            <div class="quest-list" id="questList"></div>
        </div>

        <!-- Character Stats Card -->
        <div class="card">
            <div class="card-title">🎮 Character Stats</div>
            <div class="stats-grid" id="statsGrid"></div>
        </div>

        <!-- Journal Card -->
        <div class="card">
            <div class="card-title">📝 Daily Journal</div>
            <textarea
                class="journal-textarea"
                id="journal"
                placeholder="Write your thoughts, wins, and lessons from today..."
            ></textarea>
            <div class="day-stats">
                💾 Auto-saved • Day <span id="dayIndicator"></span> • Total days tracked: <span id="daysTracked">0</span>
            </div>
        </div>

        <!-- Data Backup Card -->
        <div class="card">
            <div class="card-title">🛡️ Data Backup</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px;">
                <button onclick="exportData()" style="padding: 12px; background: rgba(76, 175, 80, 0.3); border: 1px solid rgba(76, 175, 80, 0.5);">📥 Export Data</button>
                <button onclick="importData()" style="padding: 12px; background: rgba(100, 150, 200, 0.3); border: 1px solid rgba(100, 150, 200, 0.5);">📤 Import Data</button>
            </div>
            <div style="font-size: 11px; color: #999; margin-top: 12px; text-align: center;">
                Save your progress as a file, restore if needed
            </div>
        </div>
    </div>

    <div class="install-prompt" id="installPrompt">
        <span>Add Life Simulator to your home screen?</span>
        <button onclick="installApp()">Install</button>
        <button onclick="dismissInstall()">×</button>
    </div>

    <script>
        const QUESTS = [
            { id: 'hydrate', name: 'Hydrate', icon: '💧', xp: 20 },
            { id: 'walk', name: 'Walk', icon: '🚶', xp: 20 },
            { id: 'workout', name: 'Workout', icon: '🏋️', xp: 25 },
            { id: 'protein', name: 'Eat high protein', icon: '🍗', xp: 20 },
            { id: 'learn', name: 'Learn something', icon: '📚', xp: 20 },
            { id: 'peace', name: 'Protect your peace', icon: '🧠', xp: 20 },
            { id: 'sleep', name: 'Sleep on time', icon: '😴', xp: 20 },
        ];

        function getLocalDate() {
            const d = new Date();
            return d.getFullYear() + '-' + 
                   String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                   String(d.getDate()).padStart(2, '0');
        }

        function dateStringToDate(dateStr) {
            // Parse YYYY-MM-DD without timezone conversion
            const [year, month, day] = dateStr.split('-').map(Number);
            return new Date(year, month - 1, day);
        }
        let currentDate = getLocalDate();
        let allDays = {};
        let stats = { health: 2, mind: 2, discipline: 2, confidence: 3 };
        let totalXP = 0;
        let deferredPrompt = null;

        // Level calculation
        function getLevelFromXP(xp) {
            if (xp < 500) return 1;
            if (xp < 1000) return 2;
            if (xp < 1500) return 3;
            if (xp < 2000) return 4;
            if (xp < 2500) return 5;
            return Math.floor(xp / 500);
        }

        function getXPForLevel(level) {
            return (level - 1) * 500;
        }

        function getXPToNextLevel(xp) {
            const currentLevel = getLevelFromXP(xp);
            const nextLevelXP = currentLevel * 500;
            return nextLevelXP - xp;
        }

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
                .then(registration => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed:', err));
        }

        // Handle install prompt
        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            deferredPrompt = event;
            document.getElementById('installPrompt').classList.add('show');
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(choiceResult => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('App installed');
                    }
                    deferredPrompt = null;
                    dismissInstall();
                });
            }
        }

        function dismissInstall() {
            document.getElementById('installPrompt').classList.remove('show');
        }

        function loadData() {
            try {
                const saved = localStorage.getItem('lifeSimulator_days');
                if (saved) allDays = JSON.parse(saved);

                const savedStats = localStorage.getItem('lifeSimulator_stats');
                if (savedStats) stats = JSON.parse(savedStats);

                const savedXP = localStorage.getItem('lifeSimulator_totalXP');
                if (savedXP) totalXP = parseInt(savedXP, 10);

                console.log('✓ Data loaded successfully', { allDays, stats, totalXP });
            } catch (err) {
                console.error('Error loading data:', err);
                alert('Storage issue detected. Try: Settings → Privacy → Clear site data');
            }
        }

        function saveData() {
            try {
                localStorage.setItem('lifeSimulator_days', JSON.stringify(allDays));
                localStorage.setItem('lifeSimulator_stats', JSON.stringify(stats));
                localStorage.setItem('lifeSimulator_totalXP', totalXP.toString());
                console.log('✓ Data saved:', { totalXP, statsLevel: getLevelFromXP(totalXP) });
            } catch (err) {
                console.error('Error saving data:', err);
                alert('Storage full or unavailable. Clear some space and try again.');
            }
        }

        function exportData() {
            const backup = {
                timestamp: new Date().toISOString(),
                allDays,
                stats,
                totalXP,
                level: getLevelFromXP(totalXP)
            };
            const json = JSON.stringify(backup, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `life-simulator-backup-${getLocalDate()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const backup = JSON.parse(event.target.result);
                        allDays = backup.allDays || {};
                        stats = backup.stats || { health: 2, mind: 2, discipline: 2, confidence: 3 };
                        totalXP = backup.totalXP || 0;
                        saveData();
                        updateDisplay();
                        alert('✓ Data restored! Refresh the page.');
                    } catch (err) {
                        alert('Invalid backup file');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function getCurrentDayData() {
            if (!allDays[currentDate]) {
                allDays[currentDate] = { quests: {}, journal: '' };
            }
            return allDays[currentDate];
        }

        function updateDisplay() {
            const date = dateStringToDate(currentDate);
            document.getElementById('dateDisplay').textContent = date.toLocaleDateString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric'
            });
            document.getElementById('dayIndicator').textContent = currentDate;
            document.getElementById('daysTracked').textContent = Object.keys(allDays).length;

            const dayData = getCurrentDayData();
            document.getElementById('journal').value = dayData.journal || '';

            // Update level display
            const currentLevel = getLevelFromXP(totalXP);
            const levelXP = getXPForLevel(currentLevel);
            const nextLevelXP = getXPForLevel(currentLevel + 1);
            const xpInCurrentLevel = totalXP - levelXP;
            const xpNeededForLevel = nextLevelXP - levelXP;
            const progressPercent = (xpInCurrentLevel / xpNeededForLevel) * 100;

            document.getElementById('playerLevel').textContent = currentLevel;
            document.getElementById('totalXPDisplay').textContent = totalXP;
            document.getElementById('xpToNext').textContent = Math.max(0, nextLevelXP - totalXP);
            document.getElementById('xpBar').style.width = Math.min(100, progressPercent) + '%';

            updateQuests(dayData.quests);
            updateStats();
            updateScores(dayData.quests);
        }

        function updateQuests(quests) {
            const list = document.getElementById('questList');
            list.innerHTML = '';
            QUESTS.forEach(quest => {
                const completed = quests[quest.id] || false;
                const div = document.createElement('div');
                div.className = `quest-item ${completed ? 'completed' : ''}`;
                div.innerHTML = `
                    <div class="quest-checkbox">${completed ? '✓' : ''}</div>
                    <div class="quest-content">
                        <span class="quest-icon">${quest.icon}</span>
                        <span class="quest-name">${quest.name}</span>
                        <span class="quest-xp">+${quest.xp} XP</span>
                    </div>
                `;
                div.onclick = () => toggleQuest(quest.id);
                list.appendChild(div);
            });
        }

        function updateStats() {
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = `
                ${createStatRow('Health', stats.health, '❤️')}
                ${createStatRow('Mind', stats.mind, '🧠')}
                ${createStatRow('Discipline', stats.discipline, '⚔️')}
                ${createStatRow('Confidence', stats.confidence, '😎')}
            `;
        }

        function createStatRow(label, value, icon) {
            const bars = Array(4).fill(0).map((_, i) => 
                `<div class="bar ${i < value ? 'filled' : ''}"></div>`
            ).join('');
            return `
                <div class="stat-row">
                    <div class="stat-label">
                        <span class="stat-icon">${icon}</span>
                        ${label}
                    </div>
                    <div class="stat-bars">${bars}</div>
                </div>
            `;
        }

        function updateScores(quests) {
            const completed = Object.values(quests).filter(Boolean).length;
            document.getElementById('questScore').textContent = `${completed}/7`;

            const xp = QUESTS.reduce((sum, quest) => {
                return sum + (quests[quest.id] ? quest.xp : 0);
            }, 0);
            document.getElementById('xpEarned').textContent = xp;
        }

        function toggleQuest(questId) {
            const dayData = getCurrentDayData();
            const wasCompleted = dayData.quests[questId];
            dayData.quests[questId] = !wasCompleted;

            if (!wasCompleted) {
                // Add to total XP
                const quest = QUESTS.find(q => q.id === questId);
                if (quest) {
                    totalXP += quest.xp;
                }

                // Boost stats
                if (questId === 'workout' || questId === 'protein') stats.health = Math.min(4, stats.health + 1);
                if (questId === 'peace') stats.mind = Math.min(4, stats.mind + 1);
                if (questId === 'walk' || questId === 'sleep') stats.discipline = Math.min(4, stats.discipline + 1);
                if (questId === 'learn') stats.confidence = Math.min(4, stats.confidence + 1);
            } else {
                // Uncompleting a quest - subtract XP
                const quest = QUESTS.find(q => q.id === questId);
                if (quest) {
                    totalXP = Math.max(0, totalXP - quest.xp);
                }
            }

            saveData();
            updateDisplay();
        }

        function handleJournalChange() {
            const dayData = getCurrentDayData();
            dayData.journal = document.getElementById('journal').value;
            saveData();
        }

        function prevDay() {
            const d = dateStringToDate(currentDate);
            d.setDate(d.getDate() - 1);
            currentDate = d.getFullYear() + '-' + 
                         String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                         String(d.getDate()).padStart(2, '0');
            updateDisplay();
        }

        function nextDay() {
            const d = dateStringToDate(currentDate);
            d.setDate(d.getDate() + 1);
            currentDate = d.getFullYear() + '-' + 
                         String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                         String(d.getDate()).padStart(2, '0');
            updateDisplay();
        }

        function goToToday() {
            currentDate = getLocalDate();
            updateDisplay();
        }

        document.getElementById('journal').addEventListener('input', handleJournalChange);

        // Initialize
        loadData();
        updateDisplay();
    </script>
</body>
</html>
